<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asistencia Computación</title><script src="https://unpkg.com/html5-qrcode" defer></script><style>body{font-family:Arial;margin:0;background:linear-gradient(135deg,#5b21b6,#9333ea);min-height:100vh;color:#222}.app{max-width:900px;margin:auto;padding:24px}.brand{text-align:center;color:#fff}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 12px 35px #0003}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:700px){.grid{grid-template-columns:1fr}}#reader{width:100%}.status{padding:12px;border-radius:10px;margin:12px 0;background:#ede9fe;color:#5b21b6}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}button{padding:12px 16px;border:0;border-radius:10px;background:#6d28d9;color:#fff;font-weight:bold;margin:4px;cursor:pointer}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}.footer{text-align:center;color:#666;margin-top:18px}</style></head><body><div class="app"><header class="brand"><h1>📚 ASISTENCIA COMPUTACIÓN</h1><p>Registro mediante código QR</p></header><section class="card"><div class="grid"><div><h2>📷 Escanear QR</h2><div id="reader"></div><div id="status" class="status">Preparando cámara...</div><button onclick="iniciar()">Iniciar cámara</button><button onclick="detener()">Detener</button></div><div><h2>✅ Registro</h2><div id="resultado">Escanea un QR para registrar el ingreso.</div><hr><h3>Registro manual</h3><input id="manual" placeholder="ID o nombre"><button onclick="registrar(document.getElementById('manual').value)">Registrar</button></div></div><div class="footer">Sala de Computación · Colegio Providencia</div></section></div><script>let qr=null,activo=false;const st=document.getElementById('status');function estado(t,c=''){st.textContent=t;st.className='status '+c}function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function registrar(valor){valor=String(valor||'').trim();if(!valor)return;const d=new Date(),r={dato:valor,fecha:d.toLocaleDateString('es-CL'),hora:d.toLocaleTimeString('es-CL')};const lista=JSON.parse(localStorage.getItem('asistencia')||'[]');lista.push(r);localStorage.setItem('asistencia',JSON.stringify(lista));document.getElementById('resultado').innerHTML='<div class="status ok"><b>Ingreso registrado correctamente</b></div><p><b>Identificación:</b> '+esc(valor)+'</p><p><b>Fecha:</b> '+r.fecha+'</p><p><b>Hora:</b> '+r.hora+'</p>';estado('Asistencia registrada','ok')}async function iniciar(){if(activo)return;if(typeof Html5Qrcode==='undefined'){estado('No se pudo cargar el lector QR.','bad');return}try{qr=new Html5Qrcode('reader');await qr.start({facingMode:'environment'},{fps:10,qrbox:250},registrar,()=>{});activo=true;estado('Cámara activa. Apunta al QR.','ok')}catch(e){estado('Autoriza la cámara y utiliza HTTPS.','bad')}}async function detener(){if(qr&&activo){try{await qr.stop();qr.clear()}catch(e){}activo=false;estado('Cámara detenida')}}window.addEventListener('load',()=>setTimeout(iniciar,800))</script></body></html>
