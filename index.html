<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASISTENCIA COMPUTACIÓN</title><script src="https://unpkg.com/html5-qrcode" defer></script><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:linear-gradient(135deg,#5b21b6,#9333ea);min-height:100vh;color:#222}.app{max-width:950px;margin:auto;padding:24px}.brand{text-align:center;color:#fff;margin-bottom:20px}.brand h1{margin:0;font-size:32px}.brand p{margin:7px}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 12px 35px #0003}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:700px){.grid{grid-template-columns:1fr}}#reader{width:100%;min-height:260px}.status{padding:13px;border-radius:10px;margin:12px 0;background:#ede9fe;color:#5b21b6}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.warn{background:#fef3c7;color:#92400e}button{padding:12px 16px;border:0;border-radius:10px;background:#6d28d9;color:#fff;font-weight:bold;margin:4px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:5px 0 10px;font-size:16px}.persona{background:#f5f3ff;padding:16px;border-radius:12px;margin:10px 0}.persona h3{margin:0 0 8px;color:#5b21b6}.footer{text-align:center;color:#666;margin-top:20px;font-size:13px}</style></head><body><div class="app"><header class="brand"><h1>📚 ASISTENCIA COMPUTACIÓN</h1><p>Registro de ingreso mediante código QR</p></header><section class="card"><div class="grid"><div><h2>📷 Escanear QR</h2><div id="reader"></div><div id="status" class="status">Preparando lector...</div><button onclick="iniciar()">Iniciar cámara</button><button onclick="detener()">Detener</button></div><div><h2>👤 Registro</h2><input id="rut" placeholder="RUT (ej. 12.345.678-9)" autocomplete="off"><button id="buscarBtn" onclick="buscar()">Buscar persona</button><div id="persona"></div><label for="equipo"><b>Equipo utilizado</b></label><input id="equipo" placeholder="Ej. PC-01"><button id="guardarBtn" onclick="guardar()" disabled>Registrar asistencia</button><div id="resultado"></div><hr><p><small>El QR debe contener el RUT de la persona. También puedes escribirlo manualmente.</small></p></div></div><div class="footer">Sala de Computación · Colegio Providencia</div></section></div><script>
let qr=null,activo=false,personaActual=null;const st=document.getElementById('status');
function estado(t,c=''){st.textContent=t;st.className='status '+c}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function mostrarPersona(p){personaActual=p;document.getElementById('persona').innerHTML='<div class="persona"><h3>✅ Persona encontrada</h3><div><b>Nombre:</b> '+esc(p.nombre)+'</div><div><b>RUT:</b> '+esc(p.rut)+'</div></div>';document.getElementById('guardarBtn').disabled=false}
function buscar(){const rut=document.getElementById('rut').value.trim();if(!rut){estado('Ingresa un RUT','warn');return}document.getElementById('buscarBtn').disabled=true;estado('Buscando persona...');if(typeof google==='undefined'||!google.script||!google.script.run){estado('La búsqueda por Google Sheets requiere abrir la aplicación desde Google Apps Script.','bad');document.getElementById('buscarBtn').disabled=false;return}google.script.run.withSuccessHandler(p=>{document.getElementById('buscarBtn').disabled=false;if(p.encontrado){mostrarPersona(p);estado('Persona encontrada','ok')}else{personaActual=null;document.getElementById('persona').innerHTML='<div class="status warn">'+esc(p.mensaje||'RUT no encontrado')+'</div>';document.getElementById('guardarBtn').disabled=true;estado('No se encontró el RUT','warn')}}).withFailureHandler(e=>{document.getElementById('buscarBtn').disabled=false;estado('Error: '+esc(e.message||e),'bad')}).buscarPersona(rut)}
function procesarQR(texto){const valor=String(texto||'').trim();if(!valor)return;document.getElementById('rut').value=valor;buscar()}
function guardar(){if(!personaActual)return;const equipo=document.getElementById('equipo').value.trim();document.getElementById('guardarBtn').disabled=true;estado('Guardando asistencia...');google.script.run.withSuccessHandler(r=>{document.getElementById('resultado').innerHTML='<div class="status ok"><b>✅ '+esc(r.mensaje)+'</b><br>Fecha: '+esc(r.fecha)+'<br>Hora: '+esc(r.hora)+'</div>';estado('Asistencia registrada correctamente','ok');document.getElementById('guardarBtn').disabled=false}).withFailureHandler(e=>{estado('Error al guardar: '+esc(e.message||e),'bad');document.getElementById('guardarBtn').disabled=false}).guardarRegistro(personaActual.rut,personaActual.nombre,equipo)}
async function iniciar(){if(activo)return;if(typeof Html5Qrcode==='undefined'){estado('No se pudo cargar el lector QR. Revisa Internet.','bad');return}try{qr=new Html5Qrcode('reader');await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},procesarQR,()=>{});activo=true;estado('Cámara activa. Apunta al QR.','ok')}catch(e){estado('No se pudo acceder a la cámara. Autoriza el permiso y usa HTTPS.','bad')}}async function detener(){if(qr&&activo){try{await qr.stop();qr.clear()}catch(e){}activo=false;estado('Cámara detenida')}}window.addEventListener('load',()=>setTimeout(()=>{if(typeof google!=='undefined'&&google.script)iniciar();else estado('Sistema listo. Para usar PERSONAS y REGISTROS, abre la aplicación desde Apps Script.','warn')},800));</script></body></html>
