<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASISTENCIA COMPUTACIÓN</title><script src="https://unpkg.com/html5-qrcode"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#5b21b6,#9333ea);min-height:100vh;color:#222}.app{max-width:950px;margin:auto;padding:22px}.brand{text-align:center;color:#fff}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 15px 40px #0004}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:700px){.grid{grid-template-columns:1fr}}#reader{width:100%;min-height:260px}.status{padding:13px;border-radius:10px;margin:12px 0;background:#ede9fe;color:#5b21b6}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.warn{background:#fef3c7;color:#92400e}button{padding:12px 16px;border:0;border-radius:10px;background:#6d28d9;color:#fff;font-weight:bold;margin:4px;cursor:pointer}button:disabled{opacity:.5}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:6px 0 12px;font-size:16px}.persona{background:#f5f3ff;padding:16px;border-radius:12px;margin:10px 0}.footer{text-align:center;color:#666;margin-top:20px;font-size:13px}</style></head><body><main class="app"><header class="brand"><h1>📚 ASISTENCIA COMPUTACIÓN</h1><p>Registro mediante código QR</p></header><section class="card"><div class="grid"><div><h2>📷 Escanear QR</h2><div id="reader"></div><div id="status" class="status">Preparando cámara...</div><button onclick="iniciar()">Iniciar cámara</button><button onclick="detener()">Detener</button></div><div><h2>👤 Registro</h2><input id="rut" placeholder="RUT: 12.345.678-9"><button id="buscarBtn" onclick="buscar()">🔎 Buscar</button><div id="persona"></div><label><b>Equipo utilizado</b></label><input id="equipo" placeholder="Ej. PC-01"><button id="guardarBtn" onclick="guardar()" disabled>✅ Registrar asistencia</button><div id="resultado"></div></div></div><div class="footer">Sala de Computación · Colegio Providencia</div></section></main><script>
const API='https://script.google.com/a/macros/colprovidencia.cl/s/AKfycbwtCxnO2nwP384mpJlsFT9300W6rzSQkExhkdA5mKULALbWNbEq9D9XeX55Zh6lYg8Mzg/exec';let qr=null,activo=false,persona=null,callbackId=0;const st=document.getElementById('status');function estado(t,c=''){st.textContent=t;st.className='status '+c}function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function jsonp(url){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+(++callbackId);const script=document.createElement('script');let terminado=false;window[cb]=d=>{terminado=true;delete window[cb];script.remove();resolve(d)};script.onerror=()=>{if(!terminado){delete window[cb];script.remove();reject(new Error('No se pudo conectar con Google Sheets'))}};script.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(script);setTimeout(()=>{if(!terminado){delete window[cb];script.remove();reject(new Error('Tiempo de espera agotado al conectar con Google Sheets'))}},15000)})}async function buscar(){const rut=document.getElementById('rut').value.trim();if(!rut){estado('Ingresa un RUT','warn');return}document.getElementById('buscarBtn').disabled=true;estado('Buscando persona...');try{const r=await jsonp(API+'?accion=buscar&rut='+encodeURIComponent(rut));document.getElementById('buscarBtn').disabled=false;if(r.encontrado){persona=r;document.getElementById('persona').innerHTML='<div class="persona"><b>✅ Persona encontrada</b><p><b>Nombre:</b> '+esc(r.nombre)+'</p><p><b>RUT:</b> '+esc(r.rut)+'</p></div>';document.getElementById('guardarBtn').disabled=false;estado('Persona encontrada','ok')}else{persona=null;document.getElementById('persona').innerHTML='<div class="status warn">⚠️ '+esc(r.mensaje||'RUT no encontrado')+'</div>';document.getElementById('guardarBtn').disabled=true;estado('RUT no encontrado','warn')}}catch(e){document.getElementById('buscarBtn').disabled=false;estado('❌ '+esc(e.message),'bad')}}function procesarQR(texto){if(!texto)return;document.getElementById('rut').value=texto.trim();buscar()}async function guardar(){if(!persona)return;const equipo=document.getElementById('equipo').value.trim();document.getElementById('guardarBtn').disabled=true;estado('Guardando asistencia...');try{const r=await jsonp(API+'?accion=guardar&rut='+encodeURIComponent(persona.rut)+'&nombre='+encodeURIComponent(persona.nombre)+'&equipo='+encodeURIComponent(equipo));if(!r.ok)throw new Error(r.mensaje||'No se pudo guardar');document.getElementById('resultado').innerHTML='<div class="status ok"><b>✅ '+esc(r.mensaje)+'</b><br>Fecha: '+esc(r.fecha)+'<br>Hora: '+esc(r.hora)+'</div>';estado('Asistencia registrada en Google Sheets','ok');persona=null;document.getElementById('rut').value='';document.getElementById('equipo').value='';document.getElementById('persona').innerHTML='';document.getElementById('guardarBtn').disabled=true}catch(e){document.getElementById('guardarBtn').disabled=false;estado('❌ '+esc(e.message),'bad')}}async function iniciar(){if(activo)return;try{qr=new Html5Qrcode('reader');await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},procesarQR,()=>{});activo=true;estado('📷 Cámara activa. Apunta al QR.','ok')}catch(e){estado('❌ Cámara bloqueada. Revisa permisos del navegador y que estés usando HTTPS.','bad')}}async function detener(){if(qr&&activo){try{await qr.stop();qr.clear()}catch(e){}activo=false;estado('Cámara detenida')}}window.addEventListener('load',()=>setTimeout(iniciar,800));</script></body></html>
