<style>

   CONFIGURACIÓN GENERAL
===================================================== */

}

}

===================================================== */

   TITULO
===================================================== */

}

/* =====================================================

===================================================== */

        #92400e;

}


/* =====================================================
   INPUTS
===================================================== */

label {

    display:

    margin-top:
        12px;

}


input {

    width:

        14px;

}

}

.btn-detener:hover {

}


/* =====================================================
   PERSONA
===================================================== */

.persona {

    background:

        12px;

        18px;

    margin-top:

}

    margin-top:

}


.persona p {

}

===================================================== */

.resultado {

    margin-top:

}

.estadoConexion {

    margin-top:

    button {

@media (min-width: 1200px) {

   OCULTAR ELEMENTOS INTERNOS DEL LECTOR

    width:

    max-width:

}


#reader__scan_region {

    min-height:
        230px;

}


/* =====================================================
   INDICADOR DE CAMARA
===================================================== */

.indicador-camara {

    display:
        flex;

    align-items:
        center;

    justify-content:

        14px;

    font-weight:

}


.punto {

}


.punto.activo {

        0 0 10px
        #22c55e;

<div class="contenedor">


<!-- =====================================================
     TITULO
===================================================== -->

<div class="titulo">

    <h1>
        📚 ASISTENCIA COMPUTACIÓN
    </h1>

    <p>
        Registro de ingreso mediante código QR
    </p>

</div>


<div class="panel">


<div class="grid">


<!-- =====================================================
     CAMARA
===================================================== -->

<div>

    <h2>
        📷 Escanear QR
    </h2>


    <div class="camara-contenedor">

        <div id="reader">
        </div>

    </div>


    <div
        class="indicador-camara">

        <span
            id="puntoCamara"
            class="punto">
        </span>

        <span
            id="textoCamara">

            Cámara detenida

        </span>

    </div>


    <div
        id="estado"
        class="estado">

        Preparando cámara...

    </div>


    <div class="botones">

        <button
            onclick="iniciarCamara()">

            📷 Iniciar cámara

        </button>


        <button
            class="btn-detener"
            onclick="detenerCamara()">

            ⛔ Detener

        </button>

    </div>

</div>



<!-- =====================================================
     REGISTRO
===================================================== -->

<div>

    <h2>
        👤 Registro
    </h2>


    <label for="rut">

        <strong>
            RUT
        </strong>

    </label>


    <input
        id="rut"
        type="text"
        placeholder="12.345.678-9"
        autocomplete="off">


    <div class="botones">

        <button
            id="btnBuscar"
            onclick="buscarPersona()">

            🔎 Buscar persona

        </button>

    </div>


    <div id="persona">
    </div>


    <label for="equipo">

        <strong>
            Equipo utilizado
        </strong>

    </label>


    <input
        id="equipo"
        type="text"
        placeholder="Ej: PC-01"
        autocomplete="off">


    <div class="botones">

        <button
            id="btnRegistrar"
            onclick="guardarAsistencia()"
            disabled>

        </button>

    </div>

        id="resultado"

</div>

</div>


<!-- =====================================================
     CONEXION
===================================================== -->

<div
    id="conexion"
    class="estadoConexion">

    🔄 Comprobando conexión con Google Sheets...

</div>

     FOOTER

<script>


// =====================================================
// CONFIGURACIÓN
// =====================================================

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyBpPbL1Lh50vvUF7e72PwIoPFt8oTfmzEaNbvR2IQ0-xBvmh897xWAKCZXk7sXMMoBCw/exec";


let lectorQR = null;

let camaraActiva = false;

let personaEncontrada = null;

let ultimoQR = "";

let procesandoQR = false;


// =====================================================
// ESTADO GENERAL
// =====================================================

function mostrarEstado(
    mensaje,
    tipo = ""
) {

    const elemento =
        document.getElementById(
            "estado"
        );

    elemento.innerHTML =
        mensaje;

    elemento.className =
        "estado " + tipo;

}


// =====================================================
// ESTADO DE CAMARA
// =====================================================

function actualizarEstadoCamara(
    activa
) {

    const punto =
        document.getElementById(
            "puntoCamara"
        );

    const texto =
        document.getElementById(
            "textoCamara"
        );


    if (activa) {

        punto.classList.add(
            "activo"
        );

        texto.innerHTML =
            "Cámara activa";

    }

    else {

        punto.classList.remove(
            "activo"
        );

        texto.innerHTML =
            "Cámara detenida";

    }

}


// =====================================================
// ESCAPAR HTML
// =====================================================

function escapar(texto) {

    return String(
        texto ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


// =====================================================
// LLAMAR GOOGLE APPS SCRIPT
// =====================================================
// IMPORTANTE:
// NO utilizamos application/json.
// Esto evita el preflight CORS.
// =====================================================

async function llamarGoogle(
    datos
) {

    const parametros =
        new URLSearchParams();


    Object.keys(
        datos
    ).forEach(
        function(clave) {

            parametros.append(
                clave,
                datos[clave] ?? ""
            );

        }
    );


    const respuesta =
        await fetch(
            GOOGLE_SCRIPT_URL,
            {

                method:
                    "POST",

                body:
                    parametros

            }
        );


    if (!respuesta.ok) {

        throw new Error(
            "Error HTTP " +
            respuesta.status
        );

    }


    const texto =
        await respuesta.text();


    try {

        return JSON.parse(
            texto
        );

    }

    catch(error) {

        console.error(
            "Respuesta Google:",
            texto
        );

        throw new Error(
            "Google Apps Script no devolvió una respuesta válida"
        );

    }

}


// =====================================================
// PROBAR CONEXION
// =====================================================

async function probarConexion() {

    const elemento =
        document.getElementById(
            "conexion"
        );


    elemento.className =
        "estadoConexion";


    elemento.innerHTML =
        "🔄 Comprobando conexión con Google Sheets...";


    try {

        const respuesta =
            await fetch(
                GOOGLE_SCRIPT_URL,
                {
                    method:
                        "GET"
                }
            );


        if (!respuesta.ok) {

            throw new Error(
                "HTTP " +
                respuesta.status
            );

        }


        const texto =
            await respuesta.text();


        const datos =
            JSON.parse(
                texto
            );


        if (
            datos.ok &&
            datos.estado ===
            "conectado"
        ) {

            elemento.className =
                "estadoConexion conexion-ok";

            elemento.innerHTML =
                "🟢 Google Sheets conectado";

        }

        else {

            elemento.className =
                "estadoConexion conexion-error";

            elemento.innerHTML =
                "🔴 Google Sheets respondió con error";

        }

    }

    catch(error) {

        console.error(
            "Error de conexión:",
            error
        );


        elemento.className =
            "estadoConexion conexion-error";


        elemento.innerHTML =
            "🔴 Google Sheets no disponible";

    }

}


// =====================================================
// PROCESAR QR
// =====================================================

function procesarQR(
    contenido
) {

    if (!contenido) {

        return;

    }


    contenido =
        contenido
            .toString()
            .trim();


    if (
        procesandoQR ||
        contenido ===
        ultimoQR
    ) {

        return;

    }


    ultimoQR =
        contenido;

    procesandoQR =
        true;


    document.getElementById(
        "rut"
    ).value =
        contenido;


    buscarPersona()
        .finally(
            function() {

                setTimeout(
                    function() {

                        procesandoQR =
                            false;

                        ultimoQR =
                            "";

                    },
                    1500
                );

            }
        );

}


// =====================================================
// BUSCAR PERSONA
// =====================================================

async function buscarPersona() {

    const rut =
        document
            .getElementById(
                "rut"
            )
            .value
            .trim();


    if (!rut) {

        mostrarEstado(
            "⚠️ Ingresa un RUT",
            "advertencia"
        );

        return;

    }


    const boton =
        document.getElementById(
            "btnBuscar"
        );


    boton.disabled =
        true;


    mostrarEstado(
        "🔎 Buscando persona...",
        ""
    );


    try {

        const respuesta =
            await llamarGoogle({

                accion:
                    "buscarPersona",

                rut:
                    rut

            });


        if (
            respuesta.ok &&
            respuesta.encontrado
        ) {

            personaEncontrada =
                respuesta;


            document.getElementById(
                "persona"
            ).innerHTML = `

                <div class="persona">

                    <h3>
                        ✅ Persona encontrada
                    </h3>

                    <p>

                        <strong>
                            Nombre:
                        </strong>

                        <br>

                        ${escapar(
                            respuesta.nombre
                        )}

                    </p>

                    <p>

                        <strong>
                            RUT:
                        </strong>

                        <br>

                        ${escapar(
                            respuesta.rut
                        )}

                    </p>

                </div>

            `;


            document.getElementById(
                "btnRegistrar"
            ).disabled =
                false;


            mostrarEstado(
                "✅ Persona encontrada",
                "correcto"
            );

        }

        else {

            personaEncontrada =
                null;


            document.getElementById(
                "persona"
            ).innerHTML = `

                <div class="estado advertencia">

                    ⚠️ ${
                        escapar(
                            respuesta.mensaje ||
                            "RUT no encontrado"
                        )
                    }

                </div>

            `;


            document.getElementById(
                "btnRegistrar"
            ).disabled =
                true;


            mostrarEstado(
                "⚠️ RUT no encontrado",
                "advertencia"
            );

        }

    }

    catch(error) {

        console.error(
            "Error buscando persona:",
            error
        );


        mostrarEstado(
            "❌ Error de conexión con Google Sheets",
            "error"
        );

    }

    finally {

        boton.disabled =
            false;

    }

}


// =====================================================
// GUARDAR ASISTENCIA
// =====================================================

async function guardarAsistencia() {

    if (!personaEncontrada) {

        mostrarEstado(
            "⚠️ Primero busca una persona",
            "advertencia"
        );

        return;

    }


    const equipo =
        document
            .getElementById(
                "equipo"
            )
            .value
            .trim();


    const boton =
        document.getElementById(
            "btnRegistrar"
        );


    boton.disabled =
        true;


    mostrarEstado(
        "💾 Guardando asistencia...",
        ""
    );


    try {

        const respuesta =
            await llamarGoogle({

                accion:
                    "guardarRegistro",

                rut:
                    personaEncontrada.rut,

                nombre:
                    personaEncontrada.nombre,

                equipo:
                    equipo

            });


        if (respuesta.ok) {

            document.getElementById(
                "resultado"
            ).innerHTML = `

                <div class="estado correcto">

                    <strong>

                        ✅ ${
                            escapar(
                                respuesta.mensaje
                            )
                        }

                    </strong>

                    <br><br>

                    📅 Fecha:
                    ${escapar(
                        respuesta.fecha
                    )}

                    <br>

                    🕐 Hora:
                    ${escapar(
                        respuesta.hora
                    )}

                    <br>

                    💻 Equipo:
                    ${escapar(
                        equipo ||
                        "No indicado"
                    )}

                </div>

            `;


            mostrarEstado(
                "✅ Asistencia registrada",
                "correcto"
            );


            document.getElementById(
                "rut"
            ).value =
                "";


            document.getElementById(
                "equipo"
            ).value =
                "";


            document.getElementById(
                "persona"
            ).innerHTML =
                "";


            personaEncontrada =
                null;


            boton.disabled =
                true;

        }

        else {

            throw new Error(
                respuesta.error ||
                "Error al guardar"
            );

        }

    }

    catch(error) {

        console.error(
            "Error guardando:",
            error
        );


        mostrarEstado(
            "❌ " +
            escapar(
                error.message
            ),
            "error"
        );


        boton.disabled =
            false;

    }

}


// =====================================================
// INICIAR CAMARA
// =====================================================

async function iniciarCamara() {

    if (camaraActiva) {

        return;

    }


    if (
        typeof Html5Qrcode ===
        "undefined"
    ) {

        mostrarEstado(
            "❌ No se pudo cargar el lector QR",
            "error"
        );

        return;

    }


    try {

        /*
         * Limpiamos el lector anterior
         */

        const contenedor =
            document.getElementById(
                "reader"
            );


        contenedor.innerHTML =
            "";


        lectorQR =
            new Html5Qrcode(
                "reader"
            );


        await lectorQR.start(

            {
                facingMode:
                    "environment"
            },

            {

                fps:
                    10,

                qrbox:
                {
                    width:
                        Math.min(
                            250,
                            window.innerWidth -
                            80
                        ),

                    height:
                        Math.min(
                            250,
                            window.innerWidth -
                            80
                        )
                }

            },

            function(texto) {

                procesarQR(
                    texto
                );

            },

            function() {

                /*
                 * Errores normales de lectura.
                 * No mostramos mensaje.
                 */

            }

        );


        camaraActiva =
            true;


        actualizarEstadoCamara(
            true
        );


        mostrarEstado(
            "📷 Cámara activa. Apunta al código QR.",
            "correcto"
        );

    }

    catch(error) {

        console.error(
            "Error cámara:",
            error
        );


        camaraActiva =
            false;


        actualizarEstadoCamara(
            false
        );


        mostrarEstado(

            "❌ No se pudo acceder a la cámara. " +
            "Revisa los permisos del navegador.",

            "error"

        );

    }

}


// =====================================================
// DETENER CAMARA
// =====================================================

async function detenerCamara() {

    if (
        lectorQR &&
        camaraActiva
    ) {

        try {

            await lectorQR.stop();

        }

        catch(error) {

            console.error(
                error
            );

        }


        try {

            lectorQR.clear();

        }

        catch(error) {

            console.error(
                error
            );

        }

    }


    lectorQR =
        null;

    camaraActiva =
        false;


    actualizarEstadoCamara(
        false
    );


    mostrarEstado(
        "⛔ Cámara detenida"
    );

}


// =====================================================
// INICIO
// =====================================================

window.addEventListener(
    "load",
    function() {

        /*
         * Primero comprobamos Google Sheets.
         */

        probarConexion();


        /*
         * Después iniciamos la cámara.
         */

        setTimeout(
            function() {

                iniciarCamara();

            },
            1000
        );

    }
);


</script>
